<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Side_Bar Menu | CodingBlog </title>
    <link rel="stylesheet" href="style.css">
 
<script src="https://kit.fontawesome.com/723a228234.js" crossorigin="anonymous"></script>
</head>
<body>
<div class="main_box">
    <input type="checkbox" id="check">
    <div class="btn_one">
        <label for="check">
            <i class="fas fa-bars"></i>
        </label>
    </div>
    <div class="sidebar_menu">
<div class="logo">
    <a href="#">CodingBlog</a>
</div>
<div class="btn_two">
    <label for="check">
        <i class="fas fa-times"></i>
    </label>
</div>
<ul>
                <li><a href="#"><i class="fa-solid fa-sliders"></i>
                    Dashboard</a></li>
                <li><a href="#"><i class="fa-solid fa-square-up-right"></i>
                    Shortcuts</a></li>
                <li><a href="#"><i class="fa-solid fa-magnifying-glass-chart"></i>
                    Overview</a></li>
                <li><a href="#"><i class="fa-solid fa-calendar"></i>
                    Events</a></li>
                <li><a href="#"><i class="fa-solid fa-circle-info"></i>
                    About</a></li>
                <li><a href="#"><i class="fa-brands fa-intercom"></i>
                    Services</a></li>
                <li><a href="#"><i class="fa-solid fa-phone"></i>
                    Contact</a></li>
                <li><a href="#"><i class="fa-solid fa-comment-dots"></i>
                    Feedback</a></li>
            </ul>
          <div class="social_media">
        <a href="#"><i class="fa-brands fa-square-facebook"></i></a> 
        <a href="#"><i class="fa-brands fa-instagram"></i></a>
        <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
        <a href="#"><i class="fa-brands fa-youtube"></i></a>
    </div>
    </div>
      
</div>

</body>
</html>
